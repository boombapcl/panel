<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Clientes · Panel Boombap</title>
<link rel="icon" href="/logo-marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<div class="marco">
  <main class="principal">
    <header class="cab">
      <div>
        <p class="eyebrow">Panel · Boombap</p>
        <h1>Clientes</h1>
        <p class="sub" id="sub">Cargando…</p>
      </div>
      <div class="cab-der">
        <span class="vivo" id="vivo">Cargando…</span>
        <a class="btn" href="https://noise.boombap.cl/admin/clients" target="_blank" rel="noopener noreferrer">Abrir en Noise ↗</a>
      </div>
    </header>

    <div class="c-barra">
      <div class="tabs c-tabs" id="tabs" role="tablist" aria-label="Qué clientes ver">
        <button role="tab" data-v="activos" aria-selected="true">Activos <b id="n-activos">0</b></button>
        <button role="tab" data-v="pendientes" aria-selected="false">Con pendientes <b id="n-pendientes">0</b></button>
        <button role="tab" data-v="pauta" aria-selected="false">Con pauta en Meta <b id="n-pauta">0</b></button>
        <button role="tab" data-v="inactivos" aria-selected="false">Inactivos <b id="n-inactivos">0</b></button>
      </div>
      <div class="selects c-sel">
        <label class="buscar">Buscar<input id="q" type="search" placeholder="Nombre, rubro, comuna o contacto"></label>
        <label>Ordenar<select id="orden"><option value="nombre">Nombre</option><option value="pendientes">Más pendientes</option><option value="tiempo">Más tiempo (30 días)</option></select></label>
      </div>
    </div>

    <div class="c-layout" id="layout">
      <div class="c-grid" id="grid" aria-live="polite"></div>
      <aside class="c-ficha" id="ficha" aria-label="Ficha del cliente" hidden></aside>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/cartera.js"></script>
</body>
</html>
