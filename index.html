<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bandeja · Panel Células</title>
<link rel="icon" href="/logo-marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<div class="marco">
  <nav class="riel" aria-label="Secciones">
    <div class="riel-in">
      <span class="logo"><img src="/logo-marca.png" alt="Boombap"></span>
      <a href="/" class="on" title="Bandeja" aria-label="Bandeja" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 13.5 6.2 6a1.5 1.5 0 0 1 1.4-1h8.8a1.5 1.5 0 0 1 1.4 1L20 13.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13.5h4.5a3.5 3.5 0 0 0 7 0H20"/></svg><i class="punto" id="punto" hidden></i></a>
      <a href="/celulas" title="Células y clientes" aria-label="Células y clientes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="4" r="1.6"/><circle cx="19" cy="16" r="1.6"/><circle cx="5" cy="16" r="1.6"/><path d="M12 5.6V9M17.6 15.2l-3-1.7M6.4 15.2l3-1.7"/></svg></a>
    </div>
    <span class="riel-tag">BOOMBAP · AGENTES 2026</span>
  </nav>

  <main class="principal">
    <header class="cab">
      <div>
        <p class="eyebrow">Panel Células · Boombap</p>
        <h1>Bandeja</h1>
        <p class="sub" id="sub">Todo lo que espera tu decisión, en un solo lugar.</p>
      </div>
      <div class="cab-der">
        <span class="vivo" id="vivo">Cargando…</span>
        <button class="btn" id="salir" type="button">Salir</button>
      </div>
    </header>

    <div class="aviso" id="aviso" role="status" hidden></div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Estado">
      <button role="tab" data-t="pendientes" aria-selected="true">Pendientes <b id="n-pendientes">0</b></button>
      <button role="tab" data-t="curso" aria-selected="false">En curso <b id="n-curso">0</b></button>
      <button role="tab" data-t="errores" aria-selected="false">Errores <b id="n-errores">0</b></button>
      <button role="tab" data-t="historial" aria-selected="false">Historial</button>
    </div>

    <div class="lista" id="lista" aria-live="polite"></div>
  </main>
</div>
<script type="module" src="/src/bandeja.js"></script>
</body>
</html>
